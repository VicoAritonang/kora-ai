name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.x" }
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -cover ./...
      - uses: golangci/golangci-lint-action@v8
        with: { version: latest }
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: generated SQL is in sync
        run: node scripts/build-schema.mjs && git diff --exit-code db/ migrations/

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: kora }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.x" }
      - run: psql postgres://postgres:test@localhost:5432/kora -v ON_ERROR_STOP=1 -f db/schema.sql -f db/seed.sql
      - run: go test -tags integration ./internal/store/...
        env: { TEST_DB_URL: "postgres://postgres:test@localhost:5432/kora?sslmode=disable" }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: API types are in sync with openapi.yaml
        run: npm run generate && git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/go.Dockerfile --target api -t kora-api .
      - run: docker build -f deploy/docker/go.Dockerfile --target worker -t kora-worker .
      - run: docker build -f deploy/docker/web.Dockerfile -t kora-web .
